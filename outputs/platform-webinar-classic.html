/* The classic palette and chrome stay intact; the shared wide diagrams get a full row. */
.nd-root{font-family:var(--font)!important}
.deck{height:100svh;min-height:680px;display:flex;flex-direction:column}
.masthead{height:65px;flex-shrink:0}
.stage-layout{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-height:0;flex:1;padding:18px 0 12px}
.story{display:grid;grid-template-columns:minmax(0,1fr) 315px;column-gap:42px;grid-template-rows:20px 72px 68px;flex-shrink:0;align-items:start}
.eyebrow{grid-column:1;grid-row:1;margin:0;font-size:9px;white-space:nowrap}
.story h1{grid-column:1;grid-row:2;font-size:clamp(28px,2.8vw,42px);line-height:1.12;letter-spacing:-.045em;margin:0;max-width:100%;align-self:center}
.scene-description{grid-column:1;grid-row:3;align-self:center;max-width:950px;font-size:clamp(13px,1.1vw,17px);line-height:1.5;margin:0;color:#aeb9c7}
.stage-list{grid-column:2;grid-row:1 / 3;align-self:center;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;width:100%;max-width:none;padding:0}
.step-button{display:grid;place-items:center;padding:7px 0;min-height:35px}
.step-number{width:29px;height:29px;font-size:11px}
.step-label{display:none}
.story-actions{grid-column:2;grid-row:3;align-self:center;margin:0;gap:12px;flex-wrap:nowrap;justify-content:space-between}
.primary{padding:12px 15px;font-size:12px;gap:16px;min-height:43px;white-space:nowrap}
.step-count{font-size:9px;white-space:nowrap}
.visual{align-self:auto;min-height:200px;flex:1;justify-content:flex-start}
.visual-topline{font-size:9px;padding:0;min-height:15px}
.diagram-wrap{margin:5px 0;flex:1;min-height:0;display:flex;justify-content:center}
.diagram-wrap>svg{display:block;height:100%;width:100%;max-height:none}
.visual-bottomline{font-size:9px;padding:0;min-height:14px}
.takeaway{font-size:12px;margin:4px 0 0;max-width:100%;min-height:37px;flex-shrink:0}
.navigation{height:66px;flex-shrink:0;gap:16px}
.chapter-title{display:block;font-size:10px;white-space:normal;line-height:1.25}
.chapter{padding-top:10px;padding-bottom:6px}
.chapter-number{margin-bottom:3px}
.bottom-hints{height:28px;flex-shrink:0;padding-top:5px}
.overview-fallback{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.overview-chapter{display:flex;gap:14px;padding:16px;text-align:left;background:#16212e;border:1px solid #ffffff1a;border-radius:5px}
.overview-chapter>span{font:13px var(--mono);color:var(--orange);padding-top:2px}
.overview-chapter h3{font:17px/1.3 var(--font);color:var(--text);margin:0 0 7px}
.overview-chapter p{font-size:13px;line-height:1.5;margin:0}
.overview-chapter small{display:block;margin-top:12px;font:10px var(--mono);color:var(--cyan)}
.overview-chapter:hover{border-color:var(--orange)}
@media(min-width:1700px){
 .masthead{height:80px}.stage-layout{padding-top:22px;gap:12px}
 .story{grid-template-columns:minmax(0,1fr) 385px;grid-template-rows:25px 85px 75px}
 .story h1{font-size:43px}.scene-description{font-size:18px}.eyebrow{font-size:11px}
 .stage-list{gap:9px}.step-number{width:35px;height:35px;font-size:12px}
 .primary{font-size:14px;min-height:48px}.step-count{font-size:10px}
 .takeaway{font-size:15px;min-height:46px}.navigation{height:81px}.chapter-title{font-size:12px}
 .visual-topline,.visual-bottomline{font-size:11px}
}
@media(max-width:1000px) and (min-width:821px){
 .story{grid-template-columns:minmax(0,1fr) 265px;column-gap:24px}
 .stage-list{gap:2px}.step-number{width:25px;height:25px;font-size:10px}
 .primary{font-size:11px;padding:10px;gap:8px}.step-count{font-size:8px}
 .chapter-title{font-size:9px}
}
@media(max-width:820px){
 .deck{height:auto;min-height:100svh}.masthead{height:70px}
 .stage-layout{padding:22px 0 18px;gap:16px}
 .story{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;row-gap:14px}
 .eyebrow,.story h1,.scene-description,.stage-list,.story-actions{grid-column:1;grid-row:auto}
 .eyebrow{font-size:9px;white-space:normal}.story h1{font-size:32px;min-height:72px;align-self:start}
 .scene-description{font-size:15px;min-height:90px;align-self:start}
 .stage-list{width:315px;max-width:100%;gap:5px;align-self:start}.story-actions{justify-content:flex-start;gap:22px}
 .visual{min-height:0}.diagram-wrap{overflow-x:auto;padding:5px 0 14px;justify-content:flex-start;flex:none}
 .diagram-wrap>svg{display:block;min-width:900px;height:auto;width:100%;flex-shrink:0}
 .visual-bottomline span:first-child{visibility:visible;font-size:9px}
 .takeaway{min-height:40px;font-size:13px;margin:0}
 .navigation{height:auto;min-height:94px;padding:12px 0}.chapters{gap:6px}.chapter-title{display:block;font-size:9px}
 .bottom-hints{height:auto;min-height:33px}.overview-fallback{grid-template-columns:1fr}
}
@media(max-width:450px){.story h1{font-size:29px}.chapter-title{display:none}.visual-topline{font-size:8px}.overview-chapter h3{font-size:16px}}
@media print{.deck{height:auto;min-height:0}.stage-layout{display:flex}.story{display:block}.story h1{margin:15px 0}.visual{height:400px}.takeaway{margin-top:20px}.diagram-wrap>svg{min-width:0}.visual-bottomline{display:none}}

[data-view-switcher-host]{gap:8px}
.view-switcher{--vs-bg:#111d2d;--vs-fg:#eaf1fb;--vs-muted:#94a7bf;--vs-line:#34445c;--vs-accent:#8cb9fa;--vs-hover:#1d3048;position:relative;z-index:80;flex:none;pointer-events:auto;color:var(--vs-fg);font-family:inherit;line-height:1.4;letter-spacing:normal}
.view-switcher[data-theme=light]{--vs-bg:#fff;--vs-fg:#172b46;--vs-muted:#62758e;--vs-line:#d4deeb;--vs-accent:#2269c7;--vs-hover:#eef5fd;color-scheme:light}
.view-switcher-trigger{display:flex;align-items:center;justify-content:center;gap:7px;min-width:36px;height:36px;padding:0 10px;border:1px solid var(--vs-line);border-radius:18px;background:transparent;color:var(--vs-muted);font-family:inherit;font-size:11px;font-weight:500;line-height:1;list-style:none;cursor:pointer;user-select:none;white-space:nowrap}
.view-switcher-trigger::-webkit-details-marker{display:none}
.view-switcher-trigger::marker{content:""}
.view-switcher-trigger:hover,.view-switcher[open]>.view-switcher-trigger{background:var(--vs-hover);color:var(--vs-fg);border-color:var(--vs-accent)}

<noscript>Включите JavaScript для показа последовательности. ClusterClaim задаёт итоговую версию платформы. L0 организует создание L1, а client control plane L2 работает как DaemonSet в L1 и использует etcd infra с отдельным префиксом.</noscript>
<script>(function(){var e=[{id:`prepare`,title:`От заказа к зависимостям`,kicker:`L0 · ЗАЯВКА И ПОДГОТОВКА`,question:`Что должно появиться до создания инфраструктуры?`,duration:`02:15`,beats:[{title:`Собираем версию платформы`,summary:`Сети, версии аддонов, L1 и L2, ресурсы мастеров собираются в ClusterClaim. Эта конфигурация задаёт версию платформы.`,result:`Целевая конфигурация записана в ClusterClaim в L0.`,note:`Начните с заказа L2. Покажите, что версия платформы включает весь состав: сетевые параметры, версии Kubernetes и аддонов, ресурсы мастер-нод. Эти параметры становятся одной заявкой ClusterClaim в L0. С этого момента будем следить за результатами работы над одной заявкой.`},{title:`Передаём заявку оператору`,summary:`ClusterClaim Operator читает конфигурацию и начинает подготовку. Заявка превращается в действия над зависимостями.`,result:`Оператор начал подготовку ресурсов по заявке.`,note:`Оставьте заявку на месте и покажите её связь с оператором. Именно оператор переводит желаемую конфигурацию в ресурсы и дальнейшие действия. Сейчас его задача — подготовить зависимости, которые понадобятся создаваемой платформе. Следующие моменты раскроют каждую из них.`},{title:`Заказываем бакет у облака`,summary:`Оператор запрашивает S3-бакет для резервных копий. Облако создаёт бакет и возвращает необходимые данные доступа.`,result:`Созданы backup-бакет и credentials для доступа к нему.`,note:`Проследите оба направления связи: запрос от платформы в облако и ответ с результатом. В результате появляется бакет для резервных копий и данные доступа к нему. Сам бакет остаётся ресурсом облака; его credentials следующим шагом попадут в Vault.`},{title:`Подготавливаем сертификаты`,summary:`Система сертификатов подготавливает материал доверия для компонентов. Сертификаты становятся ещё одной зависимостью платформы.`,result:`Сертификаты для компонентов подготовлены.`,note:`Переведите внимание на вторую зависимость — сертификаты для компонентов платформы. Их подготовка создаёт основу доверенных соединений. Порядок объяснения бакета и сертификатов не задаёт зависимость выпуска сертификатов от бакета: на схеме между ними не требуется последовательная стрелка.`},{title:`Сохраняем зависимости в Vault`,summary:`Credentials бакета и подготовленные сертификаты записываются в Vault. Они будут доступны следующим компонентам платформы.`,result:`Vault хранит данные доступа к бакету и сертификаты.`,note:`Покажите состав зависимостей в Vault: данные доступа к бакету и подготовленные сертификаты. Содержимое секретов показывать не нужно — достаточно назначения. Сделайте короткую паузу: у заявки появились необходимые зависимости, теперь можно переходить к инфраструктуре.`}]},{id:`infra`,title:`Из ресурса появляется L1`,kicker:`L0 → ОБЛАКО → L1`,question:`Как описание кластера превращается в работающую основу?`,duration:`02:15`,beats:[{title:`Создаём Cluster L1`,summary:`ClusterClaim Operator читает ClusterClaim и создаёт Cluster L1. Параллельно он создаёт CSR approver и CCM в L0.`,result:`По ClusterClaim созданы Cluster L1, CSR approver и CCM в L0.`,note:`Начните с ClusterClaim: заявка задаёт желаемое состояние всего процесса. ClusterClaim Operator создаёт по ней Cluster L1, который подхватит CAPI. Параллельно в L0 создаются CSR approver для подписи сертификатов нод и CCM для интеграции с облаком. Сохраните исходную заявку видимой: сюда вернётся статус L1.`},{title:`CAPI заказывает машины`,summary:`Cluster API подхватывает созданный Cluster L1 и заказывает у облака виртуальные машины для L1.`,result:`Облако создало виртуальные машины L1.`,note:`Сначала покажите ClusterClaim Operator: он читает ClusterClaim и создаёт Cluster L1 и служебные CSR approver/CCM в L0. Затем проведите взгляд от Cluster L1 через CAPI к облаку. После запроса появляются виртуальные машины, из которых формируется L1. Служебная ветка CSR approver и CCM остаётся в L0; переход внимания к машинам не переносит эти компоненты в L1.`},{title:`Подтверждаем инициализацию L1`,summary:`Статус L1 проходит через CAPI и Cluster L1 в ClusterClaim. В заявке отражено «L1 инициализирован»; далее начинается bootstrap.`,result:`ClusterClaim отражает инициализацию L1.`,note:`Проследите обратную цепочку: L1 → CAPI → Cluster L1 → ClusterClaim. Фактическая инициализация отражается в исходной заявке, которая задала желаемое состояние. После подтверждения «L1 инициализирован» начинается bootstrap. Сделайте короткую паузу между появлением машин и подтверждённым результатом.`},{title:`Запускаем сеть и DNS`,summary:`После инициализации L1 bootstrap устанавливает Cilium и CoreDNS. L1 получает сеть и DNS.`,result:`В составе bootstrap L1 появились Cilium и CoreDNS.`,note:`Раскройте первую часть исходного набора: Cilium и CoreDNS. Объясните их назначение коротко — сеть и DNS для L1. Следующим моментом раскроются средства доставки. Это разделение помогает объяснить состав bootstrap и не вводит дополнительный барьер между его компонентами.`},{title:`Включаем доставку аддонов`,summary:`Bootstrap также устанавливает Argo CD и AddonOperator. В L1 появляются средства доставки компонентов и управления их очередностью.`,result:`Argo CD и AddonOperator вошли в исходный состав L1.`,note:`Теперь добавьте Argo CD и AddonOperator к уже знакомым компонентам bootstrap. У L1 есть средства, с помощью которых можно разворачивать последующий состав платформы. Следующая глава показывает, как AddonOperator ведёт фазы Applications и как параллельно готовятся доступы в Vault.`}]},{id:`parallel`,title:`Две ветки готовят платформу`,kicker:`L1 И VAULT · ПАРАЛЛЕЛЬНО`,question:`Что готовится одновременно перед запуском L2?`,duration:`03:10`,beats:[{title:`Устанавливаем аддоны L1`,summary:`AddonOperator ведёт фазы L1 через Argo CD Applications. Параллельно ClusterClaimOperator из L0 настраивает внешний Vault.`,result:`Идут фазы L1; ClusterClaimOperator параллельно настраивает Vault для этого кластера.`,note:`Покажите две ветки и их исполнителей. В L1 AddonOperator управляет фазами через Argo CD Applications. Из L0 ClusterClaimOperator отправляет запросы во внешний Vault и настраивает его индивидуально для этого кластера. Vault хранит данные и предоставляет механизмы auth и transit. Порядок рассказа не означает ожидание одной ветки другой.`},{title:`Настраиваем mTLS и политики`,summary:`Фазы аддонов настраивают mTLS и сетевые политики в L1. Компоненты получают предусмотренную защиту соединений и сети.`,result:`В L1 применяются mTLS и сетевые политики.`,note:`Выделите ветку L1, сохраняя видимой связь ClusterClaimOperator из L0 с внешним Vault. Объясните назначение фазы: настроить защищённые соединения и сетевые политики компонентов. Затем переводите внимание к запросам оператора в Vault. Оба процесса выполняются параллельно.`},{title:`Настраиваем вход и роли в Vault`,summary:`ClusterClaimOperator из L0 регистрирует кластер в Vault auth, создаёт точечные роли и привязывает ServiceAccount L1.`,result:`ClusterClaimOperator настроил в Vault auth, роли и привязки ServiceAccount L1.`,note:`Теперь рассматриваем действие ClusterClaimOperator в L0. Оператор регистрирует этот кластер в Vault auth, создаёт точечные роли и привязки ServiceAccount L1. Внешний Vault предоставляет механизм аутентификации и сохраняет настройки. Так идентичность компонента связывается с нужными правами; фазы L1 продолжаются параллельно.`},{title:`Добавляем мониторинг и логи`,summary:`Следующая показанная фаза L1 разворачивает мониторинг и сбор логов. Платформа получает средства наблюдения за компонентами.`,result:`В L1 развёрнуты мониторинг и сбор логов.`,note:`Верните внимание к L1. В составе платформы появляются мониторинг и сбор логов. Здесь достаточно назначения и названий групп компонентов: реальные показатели не нужны. Две ветки по-прежнему видны, поэтому возврат к инфраструктуре воспринимается как смена фокуса внутри одной подготовки.`},{title:`Создаём индивидуальные секреты`,summary:`ClusterClaimOperator создаёт в Vault индивидуальные высокоэнтропийные секреты для кластера. Vault хранит эти данные.`,result:`ClusterClaimOperator создал индивидуальные секреты этого кластера в Vault.`,note:`ClusterClaimOperator создаёт индивидуальные высокоэнтропийные секреты для этого кластера и сохраняет их во внешнем Vault. Покажите направление запроса из L0 к хранилищу. Подчеркните связь между компонентом, его ролью и предназначенным ему секретом; значения секретов не требуются.`},{title:`Готовим KMS для L2`,summary:`ClusterClaimOperator из L0 настраивает в Vault KMS transit для L2. Ключ и доступы готовятся до запуска control plane L2.`,result:`ClusterClaimOperator подготовил KMS transit для L2 во внешнем Vault.`,note:`Покажите ещё один запрос ClusterClaimOperator из L0: оператор настраивает KMS transit для L2 во внешнем Vault. Vault предоставляет механизм transit и хранит подготовленные ключи. Настройки создаются индивидуально для этого кластера до запуска control plane L2. Фазы аддонов L1 идут параллельно.`},{title:`Включаем host firewall`,summary:`Завершающая фаза L1 включает host firewall с default deny. Финальные сетевые ограничения применяются после подготовки компонентов.`,result:`Host firewall с default deny завершает настройку L1.`,note:`Явно обозначьте положение host firewall в конце фаз L1. Политика default deny — завершающее действие этой ветки после подготовки состава и настроек. На схеме это последний узел очереди L1; Vault остаётся соседней веткой со своими готовыми результатами.`},{title:`Собираем условия для L2`,summary:`Аддоны L1 готовы. ClusterClaimOperator подготовил в Vault настройки этого кластера: доступы, секреты и KMS transit для L2.`,result:`Можно переходить к созданию Cluster L2.`,note:`Сведите в L0 результаты двух веток: готовые аддоны L1 и настройки, созданные ClusterClaimOperator во внешнем Vault для этого кластера. Сделайте паузу на условиях перехода. Следующий этап — создание Cluster L2 в L0. Vault остаётся внешним хранилищем и поставщиком механизмов, а инициатор настройки — оператор.`}]},{id:`client`,title:`Заказываем control plane L2`,kicker:`L0 → L1 · CLUSTER L2`,question:`Как заказ кластера становится приложением в L1?`,duration:`01:50`,beats:[{title:`Создаём Cluster L2`,summary:`После готовности L1 ClusterClaim Operator читает ClusterClaim и создаёт в L0 Cluster L2, CSR approver и CCM.`,result:`ClusterClaim Operator создал Cluster L2 и его служебные компоненты в L0.`,note:`Вернитесь к исходному ClusterClaim в L0. ClusterClaim Operator читает заявку и после готовности L1 создаёт две параллельные ветки: Cluster L2 и служебные CSR approver/CCM для L2. Оба контроллера работают в L0. Далее Cluster L2 подхватит Cluster API.`},{title:`CAPI создаёт AddonClaim`,summary:`Cluster API подхватывает Cluster L2 и приводит к созданию AddonClaim. Control plane L2 заказан как аддон платформы.`,result:`Появилась заявка AddonClaim на control plane L2.`,note:`Проследите цепочку от Cluster L2 через CAPI к AddonClaim. Здесь соединяются две модели: L2 описывается кластерным ресурсом, а его управляющие компоненты заказываются как аддон. Следующим результатом обработки AddonClaim станет ресурс Addon (CP) в L1.`},{title:`Создаём Addon (CP) в L1`,summary:`Контроллер AddonClaim создаёт ресурс Addon (CP) в L1. Этот ресурс описывает аддон, из которого будет развёрнут Control plane L2.`,result:`В L1 создан ресурс Addon (CP).`,note:`Сохраните AddonClaim видимым и покажите результат его обработки — ресурс Addon (CP) внутри L1. Пока это описание аддона. Следующим исполнителем становится AddonOperator, который подхватит этот ресурс и подготовит Applications.`},{title:`Создаём Applications`,summary:`AddonOperator подхватывает Addon (CP) в L1 и создаёт Applications. Они описывают компоненты, которые затем развернёт Argo CD.`,result:`AddonOperator создал Applications для Control plane L2.`,note:`Проведите связь от Addon (CP) к AddonOperator и затем к появляющимся Applications. Здесь важно назвать исполнителя: Applications создаёт AddonOperator на основе ресурса Addon. Дальнейшее развёртывание выполняет Argo CD.`},{title:`Разворачиваем Control plane L2 в L1`,summary:`Argo CD обрабатывает созданные Applications и разворачивает приложение Control plane L2 в L1. Цепочка доставки завершена.`,result:`Argo CD развернул приложение Control plane L2 в L1.`,note:`Покажите последнее действие: Argo CD получает Applications и разворачивает приложение Control plane L2 в L1. Сохраните видимой цепочку AddonClaim → Addon (CP) → AddonOperator → Applications → Argo CD. Затем переходите к устройству приложения: DaemonSet и связи с etcd.`}]},{id:`controlplane`,title:`Показываем устройство L2`,kicker:`РАБОТАЕТ В L1 · УПРАВЛЯЕТ L2`,question:`Где работают компоненты L2 и хранится его состояние?`,duration:`02:00`,beats:[{title:`Размещаем control plane L2 на нодах L1`,summary:`DaemonSet размещает control plane L2 на нодах L1. Управляющие компоненты L2 работают как обычное приложение внутри L1.`,result:`Control plane L2 работает на нодах L1 как DaemonSet.`,note:`Раскройте внутреннее устройство приложения: control plane L2 размещён на нодах L1 как DaemonSet. Подпись «работает в L1» должна оставаться рядом с компонентом. Показанное число условных нод не задаёт число реплик; смысл кадра — механизм и место исполнения.`},{title:`Выделяем префикс в общем etcd`,summary:`Control plane L2 использует общий etcd L1. Данные L2 размещаются в отдельном префиксе.`,result:`Состояние L2 хранится в etcd L1 под отдельным префиксом.`,note:`Покажите связь приложения с уже существующим etcd L1. Для данных L2 используется отдельный префикс внутри общего хранилища. Остановитесь на этой схеме на несколько секунд. Отдельный префикс объясняет разделение пространства ключей; дополнительных свойств изоляции из него выводить не нужно.`},{title:`Открываем API L2`,summary:`Компоненты control plane исполняются в L1. API L2 — точка доступа к ним для управления клиентским кластером.`,result:`API L2 — интерфейс доступа; запросы обслуживает control plane в L1.`,note:`Покажите логическую плоскость L2 и проведите к ней связь от control plane L2. Само приложение остаётся внутри L1. Так аудитория видит одновременно место исполнения компонентов и отдельный кластер, которым они управляют. Это центральное различие всей архитектуры.`},{title:`Возвращаем статус в ClusterClaim`,summary:`Статус Control plane L2 проходит через Applications → Addon (CP) → AddonClaim → Cluster L2 и возвращается в ClusterClaim.`,result:`Инициализация L2 отражена в ClusterClaim.`,note:`Проследите всю обратную цепочку: Control plane L2 → Applications → Addon (CP) → AddonClaim → Cluster L2 → ClusterClaim. Applications и Addon находятся в L1, AddonClaim и последующие ресурсы управления — в L0. Каждый следующий участник получает статус предыдущего. Исходная заявка отражает подтверждённую инициализацию L2. Это состояние управляющих компонентов; финальная готовность и передача L2 пользователю следуют после развёртывания стандартных аддонов.`}]},{id:`delivery`,title:`Доводим L2 и передаём пользователю`,kicker:`L0 → L1 → L2 · БАЗОВЫЕ КОМПОНЕНТЫ`,question:`Что превращает созданный control plane L2 в готовый кластер?`,duration:`01:50`,beats:[{title:`Заказываем базовые аддоны L2`,summary:`ClusterClaim Operator в L0 создаёт AddonClaim на базовые аддоны L2. Заявка запускает доставку через компоненты L1.`,result:`ClusterClaim Operator создал AddonClaim для базовых аддонов L2 в L0.`,note:`Покажите инициатора: ClusterClaim Operator в L0 создаёт AddonClaim на базовые аддоны L2. Оператор запускает подготовку стандартного набора. Дальше проследите цепочку через L1 к результату в L2: AddonClaim, Addon, Applications и развёрнутые компоненты.`},{title:`Создаём Addon для L2 в L1`,summary:`Контроллер AddonClaim создаёт Addon в L1. Ресурс описывает стандартные аддоны, которые предстоит развернуть в L2.`,result:`В L1 создан Addon для базовых компонентов L2.`,note:`Сохраните AddonClaim в L0 и покажите результат его обработки — ресурс Addon внутри L1. Он описывает будущие компоненты L2. Это вход для AddonOperator; сами Cilium, CoreDNS и Konnectivity появятся после обработки Applications.`},{title:`Создаём Applications для L2`,summary:`AddonOperator в L1 подхватывает Addon и создаёт Applications. Они задают Argo CD развёртывание базовых компонентов в L2.`,result:`В L1 созданы Applications для доставки компонентов в L2.`,note:`Покажите исполнителя: AddonOperator читает ресурс Addon и создаёт Applications в L1. Цель этих Applications — ресурсы в L2. Сохраните всю цепочку видимой: AddonClaim в L0, затем Addon и Applications в L1.`},{title:`Готовим стандартный набор L2`,summary:`Argo CD в L1 обрабатывает Applications и разворачивает ресурсы Cilium, CoreDNS и Konnectivity в L2. Базовый набор готов.`,result:`Argo CD развернул Cilium, CoreDNS и Konnectivity в L2.`,note:`Проследите переход от Applications к Argo CD в L1 и затем к результату в L2. Теперь появляются ресурсы Cilium, CoreDNS и Konnectivity. Отличайте место работы контроллеров доставки от кластера назначения. После подготовки базового набора L2 можно передавать пользователю.`},{title:`Передаём готовый кластер`,summary:`После подготовки стандартных аддонов платформа передаёт пользователю готовый Kubernetes. Путь исходного ClusterClaim завершён.`,result:`Пользователь получил готовый L2.`,note:`Вернитесь к исходному заказу: по заданной конфигурации подготовлены L1 и L2. Сделайте короткую паузу на результате. Для вопросов можно открыть общую карту: L0 координирует создание, L1 размещает инфраструктуру и control plane L2, L2 предоставляет Kubernetes API пользователю.`}]},{id:`user-apps`,title:`Разворачиваем приложение пользователя`,kicker:`L0 → L1 → L2 · ЗАКАЗ ПРИЛОЖЕНИЯ`,question:`Как пользователь получает своё приложение в готовом L2?`,duration:`01:10`,beats:[{title:`Заказываем приложение`,summary:`Пользователь создаёт заказ на приложение. Платформа формирует AddonClaim в L0 и запускает уже знакомую цепочку доставки.`,result:`Заказ пользователя представлен ресурсом AddonClaim в L0.`,note:`L2 уже подготовлен. Теперь пользователь заказывает своё приложение, и по заказу появляется AddonClaim

<script>window.WebinarContent = {
  scenes: [

 function retreat(){if(step>0){step--;writeHash();render();}else if(scene>0)goScene(scene-1,3);}
 function openDialog(kicker,title,html,wide=false){$('details-dialog').classList.toggle('wide',wide);$('dialog-kicker').textContent=kicker;$('dialog-title').textContent=title;$('dialog-content').innerHTML=html;if(!$('details-dialog').open)$('details-dialog').showModal();}
 function inspect(key){const c=components[key];if(!c)return;openDialog(c.level,c.title,'<p>'+esc(c.body)+'</p><ul>'+c.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>'+(c.code?'<p class="detail-label">Ресурс или параметр</p><code>'+esc(c.code)+'</code>':''));}
 function overview(){const visual=window.PlatformDiagram.renderOverview?'<div class="overview-svg">'+window.PlatformDiagram.renderOverview()+'</div>':'<div class="overview-fallback"><div><h3>L0 · Управление</h3><p>ClusterClaim, оператор кластеров, Cluster API, CSR approver и CCM.</p></div><div><h3>L1 · Infra</h3><p>AddonOperator и Argo CD. Client control plane работает как DaemonSet и использует etcd infra с отдельным префиксом.</p></div><div><h3>L2 · Client</h3><p>Клиентский Kubernetes API, Cilium, CoreDNS и Konnectivity.</p></div></div>';openDialog('ОБЩАЯ АРХИТЕКТУРА','Роли уровней L0, L1 и L2',visual,true);}
 function notes(){const show=$('notes-panel').hidden;$('notes-panel').hidden=!show;$('notes-button').setAttribute('aria-expanded',String(show));}
 function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true;},4000);}
 async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Для полного экрана откройте HTML в отдельном браузере и нажмите F11.');}}
 $('chapters').innerHTML=scenes.map((s,i)=>'<button class="chapter" data-scene="'+i+'" aria-label="Сцена '+(i+1)+': '+esc(navNames[i])+'"><span class="chapter-number">'+String(i+1).padStart(2,'0')+'</span><span class="chapter-title">'+esc(navNames[i])+'</span></button>').join('');
 $('chapters').addEventListener('click',e=>{const el=e.target.closest('[data-scene]');if(el)goScene(Number(el.dataset.scene));});
 $('stage-list').addEventListener('click',e=>{const el=e.target.closest('[data-step]');if(el){step=Number(el.dataset.step);writeHash();render();$('stage-list').querySelector('[data-step="'+step+'"]').focus({preventScroll:true});}});
 $('next-button').addEventListener('click',advance);$('forward-button').addEventListener('click',advance);$('previous-button').addEventListener('click',retreat);
 function onComponentClick(e){const el=e.target.closest('[data-component]');if(el)inspect(el.dataset.component);}
 $('diagram').addEventListener('click',onComponentClick);$('dialog-content').addEventListener('click',onComponentClick);
 $('diagram').addEventListener('keydown',e=>{const el=e.target.closest('[data-component]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();inspect(el.dataset.component);}});
 $('overview-button').addEventListener('click',overview);$('notes-button').addEventListener('click',notes);$('close-notes').addEventListener('click',notes);$('fullscreen-button').addEventListener('click',fullscreen);
 $('close-dialog').addEventListener('click',()=>$('details-dialog').close());
 $('details-dialog').addEventListener('click',e=>{if(e.target===$('details-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
 $('sources-button').addEventListener('click',()=>openDialog('СЦЕНАРИЙ ВЕБИНАРА','От заявки до готовой платформы','<p>Девять сцен показывают процесс создания платформы, описанный её командой. В каждой сцене четыре последовательных раскрытия. Общая длительность рассказа около 12 минут.</p><p>На схеме отдельно видны параллельные процессы: служебные аддоны CSR approver / CCM в L0 при создании Cluster и подготовка Vault во время доведения infra до целевого состояния.</p><p>Архитектурные детали, порядок bootstrap, фаз аддонов, размещение DaemonSet и использование etcd основаны на уточнённом описании команды. Реализация части оркестрации доступна в <a href="https://github.com/PRO-Robotech/cluster-claim-operator" target="_blank" rel="noopener noreferrer">cluster-claim-operator</a>.</p><p>Это автономная иллюстрация процесса. Переключение шагов не обращается к инфраструктуре.</p><p class="detail-label">Управление</p><p>← / → или пробел: предыдущий / следующий шаг. 1–9: переход к сцене. Home / End: начало / финал. N: заметки. F: полный экран. Esc: закрыть раскрытие.</p>'));
 document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||$('details-dialog').open||e.target.closest('input,textarea,select'))return;
  if(e.key==='Escape'&&!$('notes-panel').hidden){notes();return;}
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();advance();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();retreat();}
  else if(e.key===' '&&!e.target.closest('button,a,[role=button]')){e.preventDefault();advance();}
  else if(e.key==='Home'){e.preventDefault();goScene(0);}
  else if(e.key==='End'){e.preventDefault();goScene(8,3);}
  else if(/^[1-9]$/.test(e.key))goScene(Number(e.key)-1);
  else if(['n','т'].includes(e.key.toLowerCase()))notes();
  else if(['f','а'].includes(e.key.toLowerCase()))fullscreen();
 });
 window.addEventListener('hashchange',()=>{const state=readHash();const changed=scene!==state.scene;scene=state.scene;step=state.step;render(changed);});
 ({scene,step}=readHash());render();
})();
</script>
</body></html>
